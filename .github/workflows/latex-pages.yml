name: Build LaTeX and Deploy PDFs

on:
  push:
    branches: main
    paths:
      - docs/**
      - refs/**
      - Makefile
      - .github/scripts/**
      - .github/workflows/latex-pages.yml

  pull_request:
    branches: main
    paths:
      - docs/**
      - refs/**
      - Makefile
      - .github/scripts/**
      - .github/workflows/latex-pages.yml

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          ssh-key: ${{secrets.DEPLOY_KEY_SECRET}}
          fetch-depth: 0

      - name: Restore PDF cache
        uses: actions/cache@v5
        with:
          path: build-pdf
          key: pdf-cache-${{ github.run_id }}
          restore-keys: |
            pdf-cache-

      - name: Seed PDF cache from committed PDFs
        run: |
          # The committed pdfs/ directory is the source of truth, not the
          # Actions cache. A cache miss (eviction, 7-day expiry, size limit)
          # must never let the later rsync --delete wipe committed PDFs.
          mkdir -p build-pdf

          if [ -d pdfs ]; then
            rsync -av --ignore-existing pdfs/ build-pdf/
          fi

      - name: Get changed LaTeX files
        id: latex-files
        run: |
          # Use the PR base SHA for pull requests and the previous commit
          # for normal pushes.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
            [ -z "$BASE" ] && BASE=HEAD^
          fi

          # Every file under docs/ and refs/ is a candidate, not just .tex and
          # .md: a change to a shared \input, a figure or the bibliography has
          # to rebuild the documents that read it. Which documents those are is
          # decided by select_docs.py from the recorded dependency graph, so no
          # filtering by extension happens here.
          SCOPE=(
            ':(glob)docs/**'
            ':(glob)refs/**'
            'Makefile'
            ':(glob).github/workflows/latex-pages.yml'
            ':(glob).github/scripts/**'
          )

          CHANGED_FILES=$(git diff --name-only --diff-filter=d \
            "$BASE" "${{ github.sha }}" -- "${SCOPE[@]}" | xargs)

          DELETED_FILES=$(git diff --name-only --diff-filter=D \
            "$BASE" "${{ github.sha }}" -- "${SCOPE[@]}" | xargs)

          echo "Changed files: $CHANGED_FILES"
          echo "Deleted files: $DELETED_FILES"

          echo "DELETED_FILES=$DELETED_FILES" >> "$GITHUB_ENV"

          BUILD_DOCS=$(python3 .github/scripts/select_docs.py \
            --changed $CHANGED_FILES \
            --deleted $DELETED_FILES \
            --manifest .pdf-deps.json \
            --root . | xargs)

          echo "Documents to build: $BUILD_DOCS"
          echo "BUILD_DOCS=$BUILD_DOCS" >> "$GITHUB_ENV"

          CHANGED_FILENAMES=$(
            for file in $BUILD_DOCS; do
              basename "$file"
            done | xargs
          )

          echo "CHANGED_FILENAMES=$CHANGED_FILENAMES" >> "$GITHUB_ENV"

          FILE_COUNT=$(echo "$CHANGED_FILENAMES" | wc -w)

          if [ "$FILE_COUNT" -gt 1 ]; then
            PLURAL_S='s'
          else
            PLURAL_S=''
          fi

          echo "PLURAL_S=$PLURAL_S" >> "$GITHUB_ENV"

      # Install TeX Live normally rather than restoring installed package files
      # from an APT cache. TeX Live depends on package post-install scripts to
      # generate its filename database and font maps.
      - name: Install TeX Live and pandoc
        # uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        # with:
        #   packages: texlive-latex-extra texlive-science texlive-fonts-extra texlive-fonts-recommended texlive-latex-recommended lmodern pandoc
        #   version: 1.1
        run: |
          sudo apt-get update
          sudo apt -y install texlive-base \
                      texlive-latex-extra \
                      texlive-science \
                      texlive-fonts-extra \
                      texlive-fonts-recommended \
                      texlive-latex-recommended \
                      lmodern pandoc
      - name: Verify the TeX toolchain is usable
        run: |
          set -euo pipefail

          echo "Checking required commands..."

          command -v pdflatex
          command -v mktexlsr
          command -v updmap-sys
          command -v kpsewhich
          command -v pandoc

          # Rebuild TeX Live's filename database and font maps.
          sudo mktexlsr
          sudo updmap-sys >/dev/null

          echo "TeX versions:"
          pdflatex --version | head -1
          pandoc --version | head -1

          echo "Checking required LaTeX packages:"
          kpsewhich article.cls
          kpsewhich amsmath.sty
          kpsewhich lmodern.sty

          # Smoke-test Pandoc -> LaTeX -> PDF as well.
          smoke=$(mktemp -d)

          printf '%s\n' \
            '# Smoke test' \
            '' \
            'Math $x^2$ and a table:' \
            '' \
            '| a | b |' \
            '|---|---|' \
            '| 1 | 2 |' \
            > "$smoke/smoke.md"

          pandoc "$smoke/smoke.md" \
            -o "$smoke/smoke.pdf" \
            --pdf-engine=pdflatex \
            --toc \
            -V geometry:margin=1in

          test -s "$smoke/smoke.pdf"

          echo "pandoc -> PDF smoke test OK"

          rm -rf "$smoke"

      - name: Compile LaTeX
        run: |
          PDF_CACHE_DIR="$GITHUB_WORKSPACE/build-pdf"
          mkdir -p "$PDF_CACHE_DIR"

          echo "Documents selected for build: $BUILD_DOCS"

          for src in $BUILD_DOCS; do
            pdf="${src%.*}.pdf"

            # Build using existing Makefile rules.
            make -B "$pdf"

            # Record what this document actually read, for the next run's
            # change detection. Runs after the build so the .fls is present.
            python3 .github/scripts/record_deps.py \
              "$src" \
              .pdf-deps.json \
              .

            # Copy result into build-pdf, preserving structure below docs/.
            rel=$(dirname "$pdf")
            rel="${rel#docs}"
            rel="${rel#/}"

            mkdir -p "$PDF_CACHE_DIR/$rel"
            cp "$pdf" "$PDF_CACHE_DIR/$rel/"
          done

          # Remove cached PDFs that no longer have a source document.
          find "$PDF_CACHE_DIR" -name '*.pdf' -print | while read -r cached; do
            rel="${cached#$PDF_CACHE_DIR/}"
            stem="docs/${rel%.pdf}"

            if [ ! -f "$stem.tex" ] && [ ! -f "$stem.md" ]; then
              echo "Removing $rel: no source document builds it any more"
              rm -f "$cached"
            fi
          done

          # Drop manifest entries for documents that no longer exist.
          python3 .github/scripts/record_deps.py \
            --prune \
            .pdf-deps.json \
            .

      - name: Sync PDFs for TA review
        run: |
          rm -rf pdfs
          mkdir -p pdfs
          rsync -av --delete build-pdf/ pdfs/

      - name: Commit PDFs to repo
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add pdfs .pdf-deps.json

          if git diff --cached --quiet; then
            echo "No PDF changes to commit"
          else
            git commit -m "Update generated PDFs for review"

            # Another docs push may have landed while we were compiling.
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                echo "Pushed PDFs on attempt $attempt"
                exit 0
              fi

              echo "Push rejected; rebasing onto latest main (attempt $attempt)"
              git pull --rebase origin main
            done

            echo "Could not push PDFs after 3 attempts"
            exit 1
          fi

      - name: Prepare site
        run: |
          set -euo pipefail

          # Recreate public directory.
          rm -rf public
          mkdir -p public

          # Copy PDFs preserving structure.
          rsync -av build-pdf/ public/

          # Build the index.
          python3 .github/scripts/build_index.py \
            --public public \
            --template site/index.html \
            --output public/index.html \
            --tracked-dir pdfs

          # Copy static assets.
          cp site/style.css public/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build

    # Only the real branch publishes. Pull requests should build/test only.
    if: github.event_name != 'pull_request'

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5